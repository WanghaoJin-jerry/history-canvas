<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History Canvas – 3D walkthrough</title>
<style>
:root{--ui:rgba(255,255,255,.9);--ink:#1d1d1b;--mute:#6b6b66;--line:rgba(0,0,0,.16);--acc:#FCD42B;--accink:#1d1d1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:rgba(32,32,30,.88);--ink:#f2f1ec;--mute:#a9a8a0;--line:rgba(255,255,255,.22)}}
:root[data-theme="dark"]{--ui:rgba(32,32,30,.88);--ink:#f2f1ec;--mute:#a9a8a0;--line:rgba(255,255,255,.22)}
html,body{height:100%;margin:0;overflow:hidden;background:#eceae4;color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:1}
#css3d{position:fixed;inset:0;z-index:0;overflow:hidden}   /* live Figma board sits under the WebGL canvas, seen through a cut-out */
.hc-board{overflow:hidden;background:#f4f1ea}   /* clips Figma's own margin off the oversized iframe */
.panel{position:fixed;z-index:2;background:var(--ui);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
#title{left:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:min(320px,60vw)}
#title b{display:block;font-size:15px;margin-bottom:2px}
#title span{color:var(--mute)}
#btns{right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;padding:6px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover,button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hint{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));color:var(--mute);white-space:nowrap;padding:7px 14px}
.lab{position:fixed;z-index:2;left:0;top:0;pointer-events:none;background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:2px 9px;font-size:11.5px;white-space:nowrap;display:none}
.lab.step{border-color:var(--acc);border-width:2px}
.hide .lab{display:none!important}
#scene{left:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:min(300px,70vw)}
#scene b{display:block;font-size:12px;letter-spacing:.14em;margin-bottom:2px}
#scene span{color:var(--mute)}
.nocap #scene{display:none}
@media (max-width:560px){#hint{white-space:normal;width:84vw;text-align:center}#scene{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div id="title" class="panel"><b>History Canvas</b><span>Clocktower, level 2 · white model, 5 × 5 × 3 m</span></div>
<div id="btns" class="panel"><button id="bPlan">Plan view</button><button id="bLab" class="on">Labels</button><button id="bCap" class="on">Caption</button></div>
<div id="scene" class="panel"><b>01 — PASSIVE MODE</b><span>Attract attention. Invite discovery.</span></div>
<div id="hint" class="panel">Drag to look · W A S D to move · Shift to run · arrow keys turn</div>
<script src="assets/vendor/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="assets/vendor/CSS3DRenderer.js"></script>
<script src="assets/sketches/sketches-data.js"></script>
<script src="assets/history/history-data.js" onerror="this.remove()"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xeceae4);
const C=new THREE.PerspectiveCamera(70,1,.05,120);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(0xffffff,0xcfcdc6,.95);S.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.45);sun.position.set(-3,6,2);S.add(sun);

const ACC=0xFCD42B,RED=0xff2a1f;
// mineral art paint + hand-troweled plaster texture (warm cream base)
function plasterTex(){const N=1024,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');g.fillStyle='#f2ead8';g.fillRect(0,0,N,N);
  const wr=f=>{for(const dx of[-N,0,N])for(const dy of[-N,0,N]){g.save();g.translate(dx,dy);f();g.restore()}};
  for(let i=0;i<170;i++){const x=Math.random()*N,y=Math.random()*N,r=40+Math.random()*120,l=Math.random()<.5;
    wr(()=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,l?'rgba(255,252,240,.26)':'rgba(150,125,90,.18)');gr.addColorStop(1,l?'rgba(255,252,240,0)':'rgba(150,125,90,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)})}
  for(let i=0;i<11000;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,250,'+(.18+Math.random()*.32)+')':'rgba(120,100,75,'+(.1+Math.random()*.2)+')';g.fillRect(Math.random()*N,Math.random()*N,1+Math.random()*1.7,1+Math.random()*1.7)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(.25,.25);t.anisotropy=4;return t}
const wallM=new THREE.MeshLambertMaterial({color:0xffffff,map:plasterTex(),side:THREE.DoubleSide});
const accM=new THREE.MeshLambertMaterial({color:ACC});
const lineM=new THREE.LineBasicMaterial({color:0xb9b8b2});
const frameM=new THREE.LineBasicMaterial({color:0x4a4a47});
const glassM=new THREE.MeshBasicMaterial({color:0xcfe6f5,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false});
function edges(m,mat){m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,30),mat||lineM))}
const room=new THREE.Group();room.position.y=3.7;S.add(room); // room sits on level 2

// ---- room shell
function arch(P){P.moveTo(-2.25,0);P.lineTo(2.25,0);P.lineTo(2.25,2.8);P.lineTo(-2.25,2.8);P.lineTo(-2.25,0);return P}
function rect(P,x0,y0,x1,y1){P.moveTo(x0,y0);P.lineTo(x1,y0);P.lineTo(x1,y1);P.lineTo(x0,y1);P.lineTo(x0,y0);return P}
function wall(x,z,ry,hole,withWindow){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;
  const s=rect(new THREE.Shape(),-2.5,0,2.5,3);
  if(hole)s.holes.push(hole);
  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.2,bevelEnabled:false}),wallM);edges(m);g.add(m);
  if(withWindow){
    const gl=new THREE.Mesh(new THREE.ShapeGeometry(arch(new THREE.Shape())),glassM);gl.position.z=.1;g.add(gl);
    const p=arch(new THREE.Path());
    const fr=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(p.getPoints(40)),frameM);fr.position.z=.21;g.add(fr);
    const V=(a,b)=>new THREE.Vector2(a,b);
    
  }
  room.add(g);
}
wall(2.7,0,-Math.PI/2,arch(new THREE.Path()),true);          // east: window ahead of entry
wall(0,-2.7,0,arch(new THREE.Path()),true);                  // north: window on the left
wall(0,2.7,Math.PI,null,false);                              // south
wall(-2.7,0,Math.PI/2,rect(new THREE.Path(),-1.32,0,1.12,2.22),false); // west: door (z = 0.3 to 1.3)

const floor=new THREE.Mesh(new THREE.PlaneGeometry(5.4,5.4).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({map:floorTex(),color:0x7a6c58}));floor.position.y=.001;room.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(5.4,5.4).rotateX(Math.PI/2),new THREE.MeshLambertMaterial({color:0xfafaf8}));ceil.position.y=3;room.add(ceil);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0xdddbd5}));ground.position.y=-.03;S.add(ground);
const base=new THREE.Mesh(new THREE.BoxGeometry(5.4,3.68,5.4),new THREE.MeshLambertMaterial({color:0xf6f6f3}));base.position.y=1.84;edges(base);S.add(base); // level 1 volume

// ---- present: The Rocks Centre (front-left of the east window)
const rc=new THREE.Group();rc.position.set(14.5,0,-15.5);
const brM=new THREE.MeshLambertMaterial({color:0xe9e7e1});
const body=new THREE.Mesh(new THREE.BoxGeometry(9,4.6,8),brM);body.position.set(0,2.3,8);edges(body);rc.add(body);
const rear=new THREE.Mesh(new THREE.BoxGeometry(9,3.4,16),brM);rear.position.set(0,1.7,-4);edges(rear);rc.add(rear);
const rs=new THREE.Shape();rs.moveTo(-4.5,0);rs.lineTo(4.5,0);rs.lineTo(0,1.2);rs.lineTo(-4.5,0);
const roof=new THREE.Mesh(new THREE.ExtrudeGeometry(rs,{depth:8,bevelEnabled:false}).translate(0,0,-4),new THREE.MeshLambertMaterial({color:0xcfcdc6}));roof.position.y=4.6;roof.position.z=8;edges(roof);rc.add(roof);
const winM=new THREE.MeshBasicMaterial({color:0x9a9e9f});
for(let r=1;r<2;r++)for(let c=0;c<3;c++){
  const w=new THREE.Mesh(new THREE.ShapeGeometry(arch(new THREE.Shape())),winM);
  w.scale.set(.26,.5,1);w.rotation.y=-Math.PI/2;w.position.set(-4.52,.9+r*2,5.6+c*2.5);rc.add(w);
}
const oc=new THREE.Mesh(new THREE.CircleGeometry(.3,24),winM);oc.position.set(0,5.05,12.02);rc.add(oc);
[-3,3].forEach(x=>[0,1].forEach(r=>{const w=new THREE.Mesh(new THREE.ShapeGeometry(arch(new THREE.Shape())),winM);w.scale.set(.26,.5,1);w.position.set(x,.9+r*2,12.02);rc.add(w)}));
// ---- Rocks Centre detailing
const lm=new THREE.MeshLambertMaterial({color:0xf8f8f6});
const glM=new THREE.MeshBasicMaterial({color:0xa8bcc8,transparent:true,opacity:.55,depthWrite:false,side:THREE.DoubleSide});
for(let i=0;i<6;i++){const g=new THREE.Mesh(new THREE.PlaneGeometry(3,2.2),glM);g.rotation.y=-Math.PI/2;g.position.set(-4.51,1.3,-8.25+i*3.3);g.add(new THREE.LineSegments(new THREE.EdgesGeometry(g.geometry),frameM));rc.add(g)}
const aw=new THREE.Mesh(new THREE.BoxGeometry(1.7,.12,21),new THREE.MeshLambertMaterial({color:0xc9c7c0}));aw.position.set(-5.35,2.5,0);edges(aw);rc.add(aw);
const tie=[];for(let z=-9;z<=9;z+=3)tie.push(new THREE.Vector3(-4.5,3.0,z),new THREE.Vector3(-6.2,2.5,z));
rc.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(tie),frameM));
const sc2=new THREE.Mesh(new THREE.BoxGeometry(.1,.12,24),lm);sc2.position.set(-4.53,2.7,0);rc.add(sc2);
for(let c=0;c<3;c++){const z=5.6+c*2.5;
  const sl=new THREE.Mesh(new THREE.BoxGeometry(.25,.08,1.5),lm);sl.position.set(-4.6,2.82,z);rc.add(sl);
  const li=new THREE.Mesh(new THREE.BoxGeometry(.2,.12,1.5),lm);li.position.set(-4.58,4.36,z);rc.add(li)}
const bl=[];for(let y=2.9;y<=4.5;y+=.3){const z0=y<3.4?-12:4;bl.push(new THREE.Vector3(-4.503,y,z0),new THREE.Vector3(-4.503,y,12))}
for(let y=.3;y<=4.5;y+=.3)bl.push(new THREE.Vector3(-4.5,y,12.004),new THREE.Vector3(4.5,y,12.004));
rc.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(bl),new THREE.LineBasicMaterial({color:0xd3d0c6})));
const tm=new THREE.MeshLambertMaterial({color:0xcfcdc6}),ts=new THREE.Shape();ts.moveTo(0,0);ts.lineTo(4,0);ts.lineTo(0,1);ts.lineTo(0,0);
for(let i=0;i<4;i++){const t=new THREE.Mesh(new THREE.ExtrudeGeometry(ts,{depth:9,bevelEnabled:false}),tm);t.rotation.y=-Math.PI/2;t.position.set(4.5,3.4,-12+i*4);edges(t);rc.add(t)}
const gd=new THREE.Mesh(new THREE.PlaneGeometry(3,2.8),new THREE.MeshBasicMaterial({color:0x4b4e50}));gd.position.set(0,1.4,12.025);rc.add(gd);
const sk=document.createElement('canvas');sk.width=512;sk.height=96;const sg=sk.getContext('2d');sg.fillStyle='#2b2d2e';sg.fillRect(0,0,512,96);sg.fillStyle='#f1efe8';sg.font='600 46px system-ui,-apple-system,Segoe UI,sans-serif';sg.textAlign='center';sg.textBaseline='middle';sg.fillText('The Rocks Centre',256,50);
const sn=new THREE.Mesh(new THREE.PlaneGeometry(3.4,.64),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sk)}));sn.position.set(0,3.25,12.06);rc.add(sn);
[-1,1].forEach(s=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.6,5.5,.25),lm);p.position.set(s*4.2,2.75,12.1);edges(p);rc.add(p);const cp=new THREE.Mesh(new THREE.BoxGeometry(.72,.14,.37),lm);cp.position.set(s*4.2,5.57,12.1);edges(cp);rc.add(cp)});
S.add(rc);

// ---- glass projection on the east (front) and north (left) windows: passive mode (History Canvas)
// 61 community drawings from the Figma Make prototype (6 sprite sheets of 225:116 cells), drawn as
// borderless light on the glass. Near-white paper is keyed out in the shader so only the sketch remains.
// Each window runs the Figma sequence: one drawing every 3.8 s, horizontal flip in/out, the rest stay as faint traces.
const HC={
  sheets:[4,3,3,3,3,3],               // grid columns (= rows) of each sheet, in Figma order: 16 + 5×9 = 61
  inset:[.003,.003],                  // keeps neighbouring cells from bleeding in; the artwork itself is not cropped
  cols:5,rows:5,gap:.08,width:4.3,    // grid per window, metres (each window opening is 4.5 × 2.8)
  cy:1.36,depth:2.585,                // grid centre height; plane distance from the room centre (glass panes at 2.6)
  windows:[                           // at: outward direction; one shared sequence runs through them in this order
    {name:'east',ry:-Math.PI/2,at:[1,0],main:true},
    {name:'north',ry:0,at:[0,-1]}],
  rotate:true,                        // a drawing that flips in may swap with one not on the glass, so all 61 circulate
  slot:3800,flip:650,                 // Figma timing, ms: flip in over 650, hold, flip out over the last 650
  hist:7000,                          // hold for a historical image (Figma spotlight duration)
  inviteEvery:15,                     // the participation invitation takes a turn after every n drawings (main window)
  on:{op:.97,br:1.15},off:{op:.24,br:.55},   // off.op is the peak; the trace mask lowers the average to about .1–.2
  trace:.12,traceFade:9               // extra opacity left on a just-shown drawing; decay time, s
};
const hcVS='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const hcFS=`uniform sampler2D map;uniform vec4 rect;uniform vec2 inset;uniform float op,br,glow,key,trace;varying vec2 vUv;
float rbox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
void main(){
  vec2 q=vec2(gl_FrontFacing?vUv.x:1.-vUv.x,vUv.y);                          // reads the right way round from inside and outside
  vec2 p=rect.xy+mix(inset,1.-inset,q)*rect.zw,dx=vec2(.0024,0.),dy=vec2(0.,.0045);
  vec4 c=texture2D(map,p);
  float lo=min(c.r,min(c.g,c.b)),hi=max(c.r,max(c.g,c.b));
  float paper=smoothstep(.80,.95,lo)*(1.-smoothstep(.04,.12,hi-lo))*key;   // only near-white, unsaturated pixels
  float edge=1.-smoothstep(-.015,0.,rbox(vUv-.5,vec2(.5),.03));             // thin feather, no hard border
  float ink=1.;
  if(trace>0.){                                                               // inactive: keep strokes, drop flat washes and dark skies
    vec3 nb=(texture2D(map,p+dx).rgb+texture2D(map,p-dx).rgb+texture2D(map,p+dy).rgb+texture2D(map,p-dy).rgb)*.25;
    float d=1.-lo,tone=smoothstep(.18,.65,d)*(1.-.8*smoothstep(.7,.92,d));
    float line=max(smoothstep(.06,.24,length(c.rgb-nb)),tone);
    ink=mix(1.,line,trace);
  }
  vec3 col=c.rgb*br+glow*vec3(.06,.05,.03)*(1.-paper);                       // warm inner light on the active drawing
  gl_FragColor=vec4(min(col,1.),(1.-paper)*ink*edge*op);
}`;
function hcMat(map,rect,inset,key){return new THREE.ShaderMaterial({vertexShader:hcVS,fragmentShader:hcFS,transparent:true,depthWrite:false,side:THREE.DoubleSide,
  uniforms:{map:{value:map},rect:{value:new THREE.Vector4(...rect)},inset:{value:new THREE.Vector2(...inset)},op:{value:0},br:{value:1},glow:{value:0},key:{value:key},trace:{value:0}}})}
const hcW=(HC.width-(HC.cols-1)*HC.gap)/HC.cols,hcH=hcW*116/225,hcGH=HC.rows*hcH+(HC.rows-1)*HC.gap,hcN=HC.cols*HC.rows;
const slotPos=i=>new THREE.Vector3(-HC.width/2+hcW/2+(i%HC.cols)*(hcW+HC.gap),hcGH/2-hcH/2-Math.floor(i/HC.cols)*(hcH+HC.gap),0);
const tileGeo=new THREE.PlaneGeometry(hcW,hcH);
// all drawings as {map, rect} cells of their sprite sheet
const art=(function(){
  const src=window.HC_SHEETS||[],out=[];
  if(!src.length)console.warn('History Canvas: assets/sketches/sketches-data.js missing, glass shows the invitation only');
  HC.sheets.forEach((cols,s)=>{if(!src[s]){console.warn('History Canvas: sketch sheet '+s+' missing');return}
    const t=new THREE.TextureLoader().load(src[s]);t.anisotropy=Math.min(8,R.capabilities.getMaxAnisotropy());
    for(let k=0;k<cols*cols;k++)out.push({map:t,rect:[k%cols/cols,1-(Math.floor(k/cols)+1)/cols,1/cols,1/cols]})});
  return out})();
const pool=art.slice(HC.windows.length*hcN);   // drawings waiting off the glass
// soft warm-white light behind the active drawing (no frame, just a falloff)
const glowTex=(function(){const c=document.createElement('canvas');c.width=256;c.height=160;const g=c.getContext('2d');
  const gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,'rgba(255,246,228,1)');gr.addColorStop(.45,'rgba(255,246,228,.55)');gr.addColorStop(1,'rgba(255,246,228,0)');
  g.scale(1,.625);g.fillStyle=gr;g.fillRect(0,0,256,256);   // elliptical falloff, fully transparent at the edges
  return new THREE.CanvasTexture(c)})();
// participation invitation: a single keyed line in the strip above the main grid
function makeInvite(){const w=2.7,h=.15,c=document.createElement('canvas');c.width=2048;c.height=Math.round(2048*h/w);const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.textBaseline='middle';
  const A='+  LEAVE YOUR MARK',B='See the Past. Imagine the Future. Draw yours at the easel.',fa='600 62px system-ui,-apple-system,"Segoe UI",sans-serif',fb='40px system-ui,-apple-system,"Segoe UI",sans-serif';
  const ls=v=>{if('letterSpacing'in g)g.letterSpacing=v};
  g.font=fa;ls('12px');const wa=g.measureText(A).width;g.font=fb;ls('1px');const wb=g.measureText(B).width,x0=(c.width-wa-70-wb)/2;
  g.font=fa;ls('12px');g.fillStyle='#34322d';g.fillText(A,x0,c.height/2);g.font=fb;ls('1px');g.fillStyle='#5f5b52';g.fillText(B,x0+wa+70,c.height/2);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),hcMat(new THREE.CanvasTexture(c),[0,0,1,1],[0,0],1));
  m.position.set(0,hcGH/2+.05+h/2,0);m.renderOrder=3;return m}
const panes=HC.windows.map((w,wi)=>{
  const g=new THREE.Group();g.rotation.y=w.ry;g.position.set(w.at[0]*HC.depth,HC.cy,w.at[1]*HC.depth);room.add(g); // local +x = viewer's right, +z = into the room
  const tiles=[];
  if(art.length)for(let s=0;s<hcN;s++){const a=art[(wi*hcN+s)%art.length],m=new THREE.Mesh(tileGeo,hcMat(a.map,a.rect,HC.inset,1));
    m.position.copy(slotPos(s));m.renderOrder=3;g.add(m);tiles.push({m,a,heat:0})}
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,depthWrite:false,opacity:0,side:THREE.DoubleSide}));
  glow.renderOrder=2;g.add(glow);
  const invite=w.main?makeInvite():null;if(invite)g.add(invite);
  // optional historical images on the main window (assets/history/history-data.js sets window.HC_HISTORY = [dataURL, ...])
  const hist=w.main?(window.HC_HISTORY||[]).map(src=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),hcMat(new THREE.TextureLoader().load(src,t=>{
      const a=t.image.width/t.image.height,s=Math.min(HC.width/a,hcGH);m.scale.set(s*a,s,1)}),[0,0,1,1],[0,0],0));
    m.scale.set(hcGH*1.5,hcGH,1);m.position.z=.002;m.renderOrder=4;m.visible=false;g.add(m);return m}):[];
  return {tiles,glow,invite,hist,g,main:!!w.main}});
// one shared playlist across both windows: [historical images] → front drawings → left drawings,
// with the invitation (front window) after every n drawings. A single index and timer drive everything.
const play=(function(){const main=panes.find((P,i)=>HC.windows[i].main)||panes[0],out=[];let n=0;
  main.hist.forEach((_,h)=>out.push({P:main,h}));
  panes.forEach(P=>P.tiles.forEach(t=>{out.push({P,t});if(main.invite&&++n%HC.inviteEvery===0)out.push({P:main,inv:1})}));
  if(main.invite&&(!out.length||!out[out.length-1].inv))out.push({P:main,inv:1});
  if(!out.length)out.push({});
  return out})();
const seq={step:0,t0:performance.now(),swapped:false};
const hcQuiet={q:0,dim:0};   // set by the submission ceremony: q mutes the sequential highlight on both windows, dim lowers the main window
